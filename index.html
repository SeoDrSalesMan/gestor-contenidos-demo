:root{--g:#11834F;--gd:#0C6B40;--gt:#E7F3EC;--gb:#BFDFCD;--ink:#002D24;--mut:#475D59;--line:#DCE5DF;--bg:#F5FAF6;--side:#03180F}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;font-size:14px;line-height:1.5;color:var(--ink);background:var(--bg)}
h1,h2,h3{letter-spacing:-0.02em;font-weight:600;margin:0}
h1{font-size:30px}h2{font-size:18px}h3{font-size:15px}
p{margin:0}
a{color:var(--gd)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.app{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:1 0 230px;background:var(--side);padding:22px 14px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;flex-direction:column;gap:4px;padding:0 8px}
.brand img{height:30px;width:auto;align-self:flex-start}
.brand .wm{font-size:21px;font-weight:800;letter-spacing:-0.02em;color:#fff}
.brand small{font-size:12px;color:#A9C7B6}
.cli{margin:0 2px;padding:12px;border-radius:12px;background:#0B2E1E;color:#fff;display:flex;flex-direction:column;gap:8px}
.cli .nm{display:flex;align-items:center;gap:8px;font-weight:700}
.cli small{color:#A9C7B6;font-size:12px}
.cli button{min-height:36px;border-radius:8px;border:1px solid #2B5A44;background:transparent;color:#DCEBE2;font-weight:600;cursor:pointer}
.cli button:hover{background:#123C29}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;display:inline-block}
.navs{display:flex;flex-direction:column;gap:3px}
.navs .sep{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7FA08E;padding:10px 12px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:44px;border-radius:10px;font-size:14px;font-weight:500;color:#DCEBE2;text-decoration:none;border:0;background:transparent;cursor:pointer;text-align:left;width:100%}
.nav:hover{background:#0B2E1E;color:#fff}
.nav.on{background:var(--g);color:#fff;font-weight:700}
.nav.lock{color:#6F8C7C;cursor:not-allowed}
.nav.lock:hover{background:transparent;color:#6F8C7C}
.nav .cnt{margin-left:auto;font-size:12px;font-weight:700;background:#fff;color:var(--gd);border-radius:999px;padding:1px 8px}
.nav.lock .cnt{display:none}
main{flex:999 1 560px;min-width:0;padding:22px 32px 56px;display:flex;flex-direction:column;gap:22px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.top .l{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.head{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end}
.head p{color:var(--mut);max-width:760px;margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:20px}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}
.card.tint{background:var(--gt);border-color:var(--gb)}
.lbl{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}

  reporte: function () { var c = cli(), ts = temasStats(), ps = (S.posts[c.id] || []).slice().sort(function (a, b) { return b.reac - a.reac; }); var txt = 'Reporte mensual · ' + c.name + '\n\nPiezas publicadas analizadas: ' + ps.length + '\nMejor publicación: ' + (ps[0] ? ps[0].titulo + ' (' + fmt(ps[0].reac) + ' reacciones)' : '—') + '\nTema con más reacción: ' + (ts[0] ? ts[0].tema : '—') + '\nTema con menos reacción: ' + (ts.length ? ts[ts.length - 1].tema : '—') + '\n\nRecomendación para el mes siguiente: más piezas de “' + (ts[0] ? ts[0].tema : '') + '” en formato carrusel, y responder en la bandeja las preguntas de precios y horarios.'; modal('<div class="head"><h2>Reporte mensual</h2><button class="x" data-act="close" aria-label="Cerrar">×</button></div><textarea class="inp" id="rep" rows="11" readonly>' + esc(txt) + '</textarea><p class="xs mut">Datos de ejemplo. En la versión real se envía al cliente en PDF o como enlace.</p><div class="row" style="gap:10px;justify-content:flex-end"><button class="btn" data-act="copyrep">Copiar texto</button><button class="btn pri" data-act="close">Cerrar</button></div>'); },
  copyrep: function () { var t = document.getElementById('rep'); try { navigator.clipboard.writeText(t.value).then(function () { toast('Reporte copiado'); }, function () { t.select(); toast('Selecciona y copia el texto'); }); } catch (e) { t.select(); toast('Selecciona y copia el texto'); } },
  bsel: function (d) { S.band.sel = +d.id; S.band.alt = 0; render(); }, balt: function () { S.band.alt++; render(); },
  bpend: function () { S.band.pend = !S.band.pend; S.band.sel = null; render(); }, btodos: function () { S.band.todos = !S.band.todos; S.band.sel = null; render(); },
  ajtab: function (d) { S.ajTab = d.t; render(); },
  conectar: function (d) { modal('<div class="head"><h2>Conectar ' + esc(d.n) + '</h2><button class="x" data-act="close" aria-label="Cerrar">×</button></div><p>En la versión real aquí se abre la ventana oficial de ' + esc(d.n) + ' para que el dueño o el gestor de la marca inicie sesión y dé el permiso. La aplicación nunca ve ni guarda la contraseña.</p><form data-form="conectar" data-n="' + esc(d.n) + '" class="col" style="gap:14px">' + fld('Cuenta o página que se va a conectar', '<input type="text" name="h" required autocomplete="off" value="' + esc(cli().handle || '') + '">') + '<div class="row" style="gap:10px;justify-content:flex-end"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn pri">Simular conexión</button></div></form>'); },
  desconectar: function (d) { S.conn[S.client][d.n] = { st: 'no', h: '' }; toast(d.n + ' desconectada'); render(); },
  rmuser: function (d) { delete S.roles[S.client][d.u]; render(); },
  aprobartodas: function () { var n = 0; piezas().forEach(function (p) { if (p.estado === 'En revisión') { p.estado = 'Programada'; n++; } }); S.apr.sel = null; toast(n + ' piezas aprobadas y programadas'); render(); },
  repcomp: function () { var c = cli(), fw = S.follow[c.id]; modal('<div class="head"><h2>Reporte de competencia · ' + esc(S.rep[c.id].toLowerCase()) + '</h2><button class="x" data-act="close" aria-label="Cerrar">×</button></div>' + (fw.length ? '<div class="list">' + fw.map(function (f) { var r = rng(f.n + 'rep'); return '<div><b>' + esc(f.n) + '</b> <span class="chip net">' + f.red + '</span><div class="sm mut">' + (f.red === 'Web' ? 'Novedades en su sitio: ' + (1 + Math.floor(r() * 3)) + ' páginas nuevas.' : 'Su publicación con más alcance fue un ' + ['reel', 'carrusel'][Math.floor(r() * 2)] + '; publicó ' + (3 + Math.floor(r() * 9)) + ' veces.') + '</div></div>'; }).join('') + '</div>' : '<p class="mut">Aún no sigues ninguna cuenta ni sitio.</p>') + '<p class="xs mut">Datos simulados. En la versión real llega por correo con la frecuencia elegida.</p><div class="row" style="justify-content:flex-end"><button class="btn pri" data-act="close">Cerrar</button></div>'); },
  vgen: function () { var c = cli(), v = S.vid[c.id]; if (!v.idea.trim()) { toast('Escribe de qué trata el video'); return; } v.scenes = vidBuild(c, v); v.audio = ''; toast('Guion creado: ' + v.scenes.length + ' escenas'); render(); },
  vcopy: function (d) { var t = S.vid[S.client].scenes[+d.i].prompt; try { navigator.clipboard.writeText(t).then(function () { toast('Prompt copiado'); }, function () { toast('No se pudo copiar; selecciónalo a mano'); }); } catch (e) { toast('No se pudo copiar; selecciónalo a mano'); } },
  vcopyall: function () { var t = S.vid[S.client].scenes.map(function (x, i) { return 'Escena ' + (i + 1) + ' · ' + x.t + '\nVoz: ' + x.voz + '\nTexto en pantalla: ' + x.texto + '\nFotograma: ' + x.prompt; }).join('\n\n'); try { navigator.clipboard.writeText(t).then(function () { toast('Guion copiado'); }, function () { toast('No se pudo copiar'); }); } catch (e) { toast('No se pudo copiar'); } },
  vrev: function () { var c = cli(), v = S.vid[c.id], k = S.cal; var p = addPiece({ client: c.id, red: 'Instagram', formato: 'Video (guion y montaje)', titulo: cap(v.idea), pilar: c.pilares[0], estado: 'En revisión', fecha: iso(k.y, k.m, 2 + (S.seq % 26)), hora: '18:00', copy: v.scenes.map(function (x) { return x.voz; }).join(' ') }); S.apr.sel = p.id; toast('Video enviado a revisión'); go('aprobaciones'); },
  unfollow: function (d) { S.follow[S.client].splice(+d.i, 1); render(); }, rmcons: function (d) { S.cons[S.client].splice(+d.i, 1); render(); }
};
var FORM = {
  ans: function (f, fd) { S.ficha[S.client][f.dataset.k] = fd.get('v').trim(); syncComp(S.client); render(); var i = document.querySelector('[data-form=ans] input'); if (i) i.focus(); },
  ficha: function (f, fd) { var c = cli(); PREG.forEach(function (p) { S.ficha[c.id][p.k] = (fd.get(p.k) || '').trim(); }); c.c1 = fd.get('c1'); c.c2 = fd.get('c2'); syncComp(c.id); if (S.ficha[c.id].pilares) { var ps = S.ficha[c.id].pilares.split(',').map(function (x) { return x.trim(); }).filter(Boolean); if (ps.length) c.pilares = ps; } toast('Ficha guardada'); render(); },
  alta: function (f, fd) { var name = fd.get('name').trim(); if (!name) return; var c = { id: 'n' + S.seq++, name: name, sector: fd.get('sector'), donde: '', c1: fd.get('c1'), c2: fd.get('c2'), handle: '@' + name.toLowerCase().replace(/[^a-z0-9]+/g, ''), tono: '', pilares: ['Producto o servicio', 'Consejos', 'Detrás de cámaras', 'Promociones'] }; CLIENTS.push(c); seedClient(c); S.ficha[c.id].competencia = (fd.get('comp') || '').trim(); syncComp(c.id); var files = f.querySelector('[name=files]').files; S.client = c.id; closeModal(); if (files.length) addFiles(c.id, files); S.marca.tab = 'conv'; toast('Marca creada: ' + name); go('marca'); },
  com: function (f, fd) { byId(f.dataset.id).comments.push({ who: S.user, txt: fd.get('v').trim() }); render(); },
  resp: function (f, fd) { var m = S.msgs.filter(function (x) { return x.id === +f.dataset.id; })[0]; m.resp = fd.get('v').trim(); toast('Respuesta enviada a ' + m.who); render(); },
  conectar: function (f, fd) { S.conn[S.client][f.dataset.n] = { st: f.dataset.n === 'TikTok' ? 'tram' : 'ok', h: fd.get('h').trim() }; closeModal(); toast(f.dataset.n + (f.dataset.n === 'TikTok' ? ': conexión lista, subida automática pendiente' : ' conectada')); render(); },
  adduser: function (f, fd) { S.roles[S.client][fd.get('n').trim()] = fd.get('r'); toast('Persona añadida'); render(); },
  ajpub: function (f, fd) { var a = S.aj[S.client]; a.porDia = +fd.get('porDia'); a.aprueba = fd.get('aprueba'); a.dias = fd.get('dias').trim(); toast('Ajustes guardados'); render(); },
  follow: function (f, fd) { S.follow[S.client].push({ n: fd.get('n').trim(), red: fd.get('red') }); toast('Ahora sigues a ' + fd.get('n').trim()); render(); },
  cons: function (f, fd) { var r = rng(fd.get('q')); S.cons[S.client].push({ q: fd.get('q').trim(), r: [r() > .5, r() > .5, r() > .6] }); render(); },
  piece: function (f, fd) { var p = byId(f.dataset.id); p.fecha = fd.get('fecha'); p.hora = fd.get('hora'); p.estado = fd.get('estado'); var d = p.fecha.split('-'); S.cal.y = +d[0]; S.cal.m = +d[1] - 1; closeModal(); toast('Pieza actualizada'); render(); }
};
document.addEventListener('click', function (e) {
  var n = e.target.closest('[data-nav]');
  if (n) { if (n.classList.contains('lock')) { toast('Primero elige una marca'); return; } go(n.dataset.nav); return; }
  var g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  var a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]) { if (a.tagName === 'BUTTON' && a.type === 'submit' && !a.closest('form')) e.preventDefault(); ACT[a.dataset.act](a.dataset); return; }
  if (e.target.id === 'modal') closeModal();
});
document.addEventListener('submit', function (e) { var f = e.target, k = f.dataset.form; e.preventDefault(); if (FORM[k]) FORM[k](f, new FormData(f)); });
document.addEventListener('change', function (e) {
  var t = e.target, d = t.dataset;
  if (d.file) { addFiles(d.file, t.files); t.value = ''; return; }
  if (d.set) { S[d.set] = t.value; if (d.set !== 'upCat') render(); return; }
  if (d.setGen) { S.gen[d.setGen] = t.value; return; }
  if (d.setCal) { S.cal[d.setCal] = d.setCal === 'm' ? +t.value : t.value; render(); return; }
  if (d.setRd) { S.rd[d.setRd] = t.value; render(); return; }
  if (d.setRep) { S.rep[S.client] = t.value; toast('Reporte de competencia: ' + t.value.toLowerCase()); return; }
  if (d.role) { S.roles[S.client][d.role] = t.value; render(); return; }
  if (d.setVid) { S.vid[S.client][d.setVid] = t.value; return; }
  if (d.vlisto) { S.vid[S.client].scenes[+d.vlisto].listo = t.checked; render(); return; }
  if (d.vclip) { if (t.files[0]) { S.vid[S.client].scenes[+d.vclip].clip = t.files[0].name; render(); } return; }
  if (d.vaudio) { if (t.files[0]) { S.vid[S.client].audio = t.files[0].name; render(); } return; }
  if (d.actChange === 'enf') { S.gen.enfoque = +t.value; render(); return; }
  if (d.actChange === 'gred') { var i = S.gen.redes.indexOf(t.value); if (t.checked && i < 0) S.gen.redes.push(t.value); if (!t.checked && i >= 0) S.gen.redes.splice(i, 1); render(); }
});
document.addEventListener('input', function (e) { var d = e.target.dataset; if (d.setGen && e.target.tagName === 'TEXTAREA') S.gen[d.setGen] = e.target.value; if (d.setVid) S.vid[S.client][d.setVid] = e.target.value; });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !document.getElementById('modal').hidden) closeModal(); });
var dragId = null;
document.addEventListener('dragstart', function (e) { var p = e.target.closest && e.target.closest('.pc'); if (p) { dragId = p.dataset.id; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (x) {} } });
document.addEventListener('dragover', function (e) { var z = e.target.closest && (e.target.closest('[data-day]') || e.target.closest('[data-drop]')); if (z) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', function (e) { var z = e.target.closest && (e.target.closest('[data-day]') || e.target.closest('[data-drop]')); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
document.addEventListener('drop', function (e) {
  var day = e.target.closest && e.target.closest('[data-day]'), dz = e.target.closest && e.target.closest('[data-drop]');
  if (day && dragId) { e.preventDefault(); var p = byId(dragId); p.fecha = day.dataset.day; dragId = null; toast('Movida al ' + fechaTxt(p.fecha)); render(); return; }
  if (dz) { e.preventDefault(); dz.classList.remove('over'); if (e.dataTransfer.files.length) addFiles(dz.dataset.drop, e.dataTransfer.files); }
});
window.addEventListener('hashchange', route);
route();
})();
</script>
